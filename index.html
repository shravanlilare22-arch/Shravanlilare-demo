<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCrash Arena Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    :root{
      --bg1:#050816;
      --bg2:#0b1226;
      --border:rgba(255,255,255,.10);
    }
    html,body{height:100%}
    body{
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 30%),
        radial-gradient(circle at top right, rgba(168,85,247,.14), transparent 28%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color:#e5e7eb;
    }
    .glass{
      background:rgba(15,23,42,.72);
      border:1px solid var(--border);
      box-shadow:0 20px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .grid-bg{
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 36px 36px;
      background-position: center;
    }
    .pulse{
      animation:pulseGlow 2.8s ease-in-out infinite;
    }
    @keyframes pulseGlow{
      0%,100%{ transform:translateY(0); box-shadow:0 0 0 rgba(59,130,246,.0);}
      50%{ transform:translateY(-2px); box-shadow:0 0 35px rgba(59,130,246,.18);}
    }
    .fade-in{animation:fadeIn .5s ease both;}
    @keyframes fadeIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
    .option:hover{transform:translateY(-2px)}
    .option.selected{border-color:#38bdf8; background:rgba(14,165,233,.16)}
    .option.correct{border-color:#22c55e; background:rgba(34,197,94,.14)}
    .option.wrong{border-color:#ef4444; background:rgba(239,68,68,.14)}
  </style>
</head>
<body class="min-h-screen text-slate-100">

  <div id="app" class="relative z-10"></div>

    const state = { lang:null, questions:[], current:0, answers:[], startTime:0, timer:null, secondsLeft:900, name:'', lastResult:null, leaderboard:JSON.parse(localStorage.getItem('leaderboard')||'[]') };

    const el = (html) => { document.getElementById('app').innerHTML = html; bind(); };
    const shuffle = arr => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

    function getStoredName(){ return localStorage.getItem('username') || ''; }
    function saveLeaderboardEntry(name, score){
      const data = JSON.parse(localStorage.getItem('leaderboard') || '[]');
      data.push({ name, score, date: Date.now() });
      data.sort((a,b)=>b.score-a.score);
      localStorage.setItem('leaderboard', JSON.stringify(data.slice(0,10)));
      state.leaderboard = JSON.parse(localStorage.getItem('leaderboard') || '[]');
    }

    function getRank(score){
      if(score >= 18) return "Master Debugger 👑";
      else if(score >= 15) return "Expert 🔥";
      else if(score >= 10) return "Intermediate 🚀";
      else return "Beginner 📚";
    }

    function getBadge(lang){ return LANGS.find(x=>x.key===lang)?.badge || 'No Badge'; }

    function pickQuestions(lang, difficulty){
      const bank = QUESTIONS[lang].map((x,i)=>({...x, id:i}));
      let picked = shuffle(bank);
      if(difficulty === 'easy') picked = picked.slice(0,20);
      if(difficulty === 'medium') picked = picked.slice(0,20);
      if(difficulty === 'hard') picked = picked.slice(0,20);
      return picked.map(q=>({ ...q, o: shuffle(q.o), userAnswer:null }));
    }

    function renderHome(){

      el(`

                </div>
              </div>
              <div class="p-8 md:p-12 bg-gradient-to-br from-slate-900/80 to-indigo-950/70 border-t md:border-t-0 md:border-l border-white/10">
                <div class="mb-6">
                  <h2 class="text-2xl font-bold">Enter Your Name</h2>
                  <p class="text-slate-300 mt-2">Start with your username before selecting a language.</p>
                </div>
                <div class="space-y-4">
                  <input id="usernameInput" value="${savedName}" placeholder="Shravan" class="w-full px-4 py-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-sky-400/60 transition text-white placeholder-slate-400" />
                  <div class="grid grid-cols-3 gap-3">
                    ${['easy','medium','hard'].map(d=>`
                      <button onclick="setDifficulty('${d}')" class="difficultyBtn px-4 py-3 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 transition capitalize">${d}</button>
                    `).join('')}
                  </div>
                  <div class="space-y-3">
                    ${LANGS.map(l=>`
                      <button onclick="startLang('${l.key}')" class="w-full text-left p-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-sky-500/15 hover:border-sky-400/40 transition duration-300 pulse">
                        <div class="flex items-center justify-between">
                          <div>
                            <div class="font-semibold text-lg">${l.name}</div>
                            <div class="text-slate-300 text-sm mt-1">${l.desc}</div>
                          </div>
                          <div class="text-sky-300 font-bold">Start</div>
                        </div>
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-6 mt-6">
            <div class="glass rounded-3xl p-6">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">🏆 Top Players</h3>
                <span class="text-xs text-slate-400">Includes new members who take tests</span>
              </div>
              <div class="space-y-3 text-sm">
                ${leaderboard.slice(0,6).map((p,i)=>`
                  <div class="flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/10">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 rounded-full bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-sky-200 font-bold">${i+1}</div>
                      <div>
                        <div class="font-medium">${p.name}</div>
                        <div class="text-slate-400 text-xs">Member on leaderboard</div>
                      </div>
                    </div>
                    <div class="font-bold text-sky-300">${p.score}%</div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="glass rounded-3xl p-6">
              <h3 class="text-xl font-bold mb-4">Badges</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                ${LANGS.map(l=>`<div class="p-4 rounded-2xl bg-white/5 border border-white/10">${l.badge}</div>`).join('')}

    function setDifficulty(d){ localStorage.setItem('difficulty', d); }
    function getDifficulty(){ return localStorage.getItem('difficulty') || 'easy'; }

    function startLang(lang){
      const name = (document.getElementById('usernameInput')?.value || getStoredName() || 'Shravan').trim() || 'Shravan';
      localStorage.setItem("username", name);
      state.name = name;
      state.lang = lang;
      state.questions = pickQuestions(lang, getDifficulty());
      state.answers = Array(20).fill(null);
      state.current = 0;
      state.secondsLeft = 15*60;
      state.startTime = Date.now();
      clearInterval(state.timer);
      state.timer = setInterval(()=>{ state.secondsLeft--; updateTimer(); if(state.secondsLeft<=0) finishQuiz(); },1000);
      renderQuiz();
    }

    function renderQuiz(){
      const q = state.questions[state.current];
      const langName = LANGS.find(x=>x.key===state.lang).name;
      const difficulty = getDifficulty();
      const m = String(Math.floor(state.secondsLeft/60)).padStart(2,'0');
      const s = String(state.secondsLeft%60).padStart(2,'0');
      el(`
      <div class="min-h-screen px-4 py-6">
        <div class="max-w-6xl mx-auto">
          <div class="glass rounded-3xl p-4 md:p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
            <div>
              <div class="text-slate-300 text-sm">CodeCrash Arena Pro</div>
              <div class="text-2xl font-bold">${langName} Test</div>
              <div class="text-sky-300 text-sm mt-1">Welcome ${state.name}</div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <div class="px-4 py-2 rounded-full bg-white/5 border border-white/10">Question ${state.current+1}/20</div>
              <div class="px-4 py-2 rounded-full bg-sky-500/15 border border-sky-400/30 text-sky-200">Time Left: <span id="timer">${m}:${s}</span></div>
              <div class="px-4 py-2 rounded-full bg-violet-500/15 border border-violet-400/30 text-violet-200 capitalize">${difficulty}</div>
              <button onclick="finishQuiz()" class="px-4 py-2 rounded-full bg-rose-500/20 border border-rose-400/30 text-rose-100 hover:bg-rose-500/30 transition">Submit</button>
            </div>
          </div>

          <div class="grid lg:grid-cols-[1.5fr_.8fr] gap-6">
            <div class="glass rounded-3xl p-6 md:p-8 fade-in">
              <div class="flex items-center justify-between mb-5">
                <div class="text-slate-400 text-sm">Educational review included after submission.</div>
                <div class="text-sky-300 text-sm font-medium">Fresh test content</div>
              </div>
              <h2 class="text-2xl md:text-3xl font-bold leading-snug">${q.q}</h2>
              <div class="mt-6 space-y-3">
                ${q.o.map((opt,idx)=>`
                  <button onclick="choose(${idx})" class="option w-full text-left p-4 rounded-2xl border border-white/10 bg-white/5 hover:bg-white/10 transition duration-300">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-sm">${String.fromCharCode(65+idx)}</div>
                      <div>${opt}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
              <div class="mt-6 flex items-center justify-between gap-3">
                <button onclick="prevQ()" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition">Previous</button>
                <button onclick="nextQ()" class="px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold transition">Next</button>
              </div>
            </div>

            <div class="glass rounded-3xl p-6">
              <h3 class="font-bold text-lg">Progress</h3>
              <div class="mt-4 grid grid-cols-5 gap-2">
                ${state.questions.map((_,i)=>`<button onclick="gotoQ(${i})" class="qnav h-11 rounded-xl border border-white/10 ${i===state.current?'bg-sky-500 text-slate-950 font-bold':'bg-white/5'}">${i+1}</button>`).join('')}
              </div>
              <div class="mt-6 space-y-4 text-sm text-slate-300">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/10">Difficulty: ${difficulty === 'easy' ? 'basic syntax' : difficulty === 'medium' ? 'debugging' : 'logic and output prediction'}</div>
                <div class="p-4 rounded-2xl bg-white/5 border border-white/10">Correct answer = ✅ Ding</div>
                <div class="p-4 rounded-2xl bg-white/5 border border-white/10">Wrong answer = ❌ Buzz</div>
              </div>
            </div>
          </div>
        </div>
      </div>`);
      highlightSelected();
    }

    function choose(idx){ state.answers[state.current] = idx; playSound(idx === state.questions[state.current].a); highlightSelected(); }
    function playSound(isCorrect){ try{ new Audio(isCorrect ? "correct.mp3" : "wrong.mp3").play(); }catch(e){} }
    function highlightSelected(){
      document.querySelectorAll('.option').forEach((b,i)=>{
        b.classList.remove('selected');
        if(state.answers[state.current]===i) b.classList.add('selected');
      });
    }
    function prevQ(){ if(state.current>0){ state.current--; renderQuiz(); } }
    function nextQ(){ if(state.current<19){ state.current++; renderQuiz(); } else finishQuiz(); }
    function gotoQ(i){ state.current=i; renderQuiz(); }
    function updateTimer(){ const t=document.getElementById('timer'); if(t){ t.textContent = `${String(Math.floor(state.secondsLeft/60)).padStart(2,'0')}:${String(state.secondsLeft%60).padStart(2,'0')}`; } }

    function finishQuiz(){
      clearInterval(state.timer);
      let correct = 0;
      state.questions.forEach((q,i)=>{ if(state.answers[i]===q.a) correct++; });
      const total = state.questions.length;
      const accuracy = Math.round((correct/total)*100);
      const performance = Math.max(0, Math.min(100, Math.round((accuracy*0.7) + (correct*1.5))));
      const rank = getRank(correct);
      state.lastResult = { correct, wrong: total-correct, accuracy, performance, total, rank };
      saveLeaderboardEntry(state.name || 'Shravan', accuracy);
      renderResult();
    }

    function renderResult(){
      const r = state.lastResult;
      const langName = LANGS.find(x=>x.key===state.lang).name;
      const review = state.questions.map((q,i)=>{
        const ua = state.answers[i];
        const ca = q.a;
        const isCorrect = ua === ca;
        return `
          <div class="p-4 rounded-2xl border ${isCorrect ? 'border-emerald-400/20 bg-emerald-500/10' : 'border-rose-400/20 bg-rose-500/10'}">
            <div class="font-semibold">Question ${i+1}</div>
            <div class="mt-2 text-sm text-slate-200">${q.q}</div>
            <div class="mt-3 text-sm"><span class="text-slate-300">Your Answer:</span> <span class="font-medium">${ua === null ? 'Not answered' : q.o[ua]}</span></div>
            <div class="mt-1 text-sm"><span class="text-slate-300">Correct Answer:</span> <span class="font-medium">${q.o[ca]}</span></div>
            <div class="mt-2 text-sm text-slate-300">Explanation: ${q.e}</div>
          </div>`;
      }).join('');

      const leaderboard = JSON.parse(localStorage.getItem('leaderboard') || '[]');

      el(`
      <div class="min-h-screen px-4 py-8">
        <div class="max-w-6xl mx-auto">
          <div class="glass rounded-3xl p-6 md:p-8 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div class="text-slate-400 text-sm">Test Completed</div>
              <h1 class="text-3xl md:text-4xl font-black">Welcome ${state.name}</h1>
              <div class="text-sky-300 mt-1">Rank: ${r.rank}</div>
            </div>
            <div class="flex gap-3">
              <button onclick="renderHome()" class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition">Back to Home</button>
              <button onclick="startLang(state.lang)" class="px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold transition">Retake Test</button>
            </div>
          </div>

          <div class="grid lg:grid-cols-[.9fr_1.1fr] gap-6">
            <div class="glass rounded-3xl p-6 md:p-8">
              <h2 class="text-2xl font-bold mb-5">Performance Summary</h2>
              <div class="grid grid-cols-2 gap-4">
                <div class="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-400/20">
                  <div class="text-emerald-300 text-sm">Correct</div>
                  <div class="text-3xl font-black">${r.correct}</div>
                </div>
                <div class="p-4 rounded-2xl bg-rose-500/10 border border-rose-400/20">
                  <div class="text-rose-300 text-sm">Wrong</div>
                  <div class="text-3xl font-black">${r.wrong}</div>
                </div>
                <div class="p-4 rounded-2xl bg-sky-500/10 border border-sky-400/20">
                  <div class="text-sky-300 text-sm">Accuracy</div>
                  <div class="text-3xl font-black">${r.accuracy}%</div>
                </div>
                <div class="p-4 rounded-2xl bg-violet-500/10 border border-violet-400/20">
                  <div class="text-violet-300 text-sm">Performance</div>
                  <div class="text-3xl font-black">${r.performance}%</div>
                </div>
              </div>
              <div class="mt-6 p-4 rounded-2xl bg-white/5 border border-white/10">
                <div class="text-slate-300 text-sm">Badge Earned</div>
                <div class="font-semibold mt-1">${getBadge(state.lang)}</div>
              </div>
              <div class="mt-4 text-slate-300 text-sm leading-6">
                Stored username: <span class="text-white font-semibold">${localStorage.getItem('username') || 'Shravan'}</span>
              </div>
            </div>

            <div class="glass rounded-3xl p-6 md:p-8">
              <h2 class="text-2xl font-bold mb-4">Accuracy Graph</h2>
              <div id="chart" class="bg-white/5 rounded-2xl p-3"></div>
            </div>
          </div>

          <div class="glass rounded-3xl p-6 md:p-8 mt-6">
            <h2 class="text-2xl font-bold mb-5">Correct Answer Review</h2>
            <div class="grid md:grid-cols-2 gap-4">${review}</div>
          </div>

          <div class="glass rounded-3xl p-6 md:p-8 mt-6">
            <div class="flex items-center justify-between mb-5">
              <h2 class="text-2xl font-bold">🏆 Leaderboard</h2>
              <span class="text-sm text-slate-400">New member is added automatically after every test</span>
            </div>
            <div class="space-y-3">
              ${(leaderboard.length ? leaderboard : [{name:'Shravan',score:95},{name:'Rahul',score:90},{name:'Aman',score:85}]).slice(0,10).map((p,i)=>`
                <div class="flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/10">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-sky-200 font-bold">${i+1}</div>
                    <div>
                      <div class="font-medium">${p.name}</div>
                      <div class="text-xs text-slate-400">Test member</div>
                    </div>
                  </div>
                  <div class="font-bold text-sky-300">${p.score}%</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>`);
      setTimeout(()=> {
        new ApexCharts(document.querySelector("#chart"), {
          chart: { type: 'donut', height: 360, foreColor:'#cbd5e1' },
          series: [r.correct, r.wrong],
          labels: ['Correct', 'Wrong'],
          colors: ['#22c55e', '#ef4444'],
          legend: { position: 'bottom' },
          stroke: { width: 0 },
          dataLabels: { enabled: true },
          plotOptions: { pie: { donut: { size: '72%' } } }
        }).render();
      }, 50);
    }

    function bind(){}
    renderHome();
  </script>
</body>
</html>
