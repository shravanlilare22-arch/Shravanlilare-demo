<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeCrash Arena Ultimate</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>

<div class="background"></div>

<header class="navbar">
    <h1>⚡ CodeCrash Arena Ultimate</h1>


<div class="user-box">
    <span id="username">Guest</span>
    <span id="level">Level 1</span>
</div>


</header>

<section class="hero">


<h2>Master Coding Skills</h2>

<p>
    Practice Python, Java, C, C++, PHP and become a coding champion.
</p>

<input
    type="text"
    id="playerName"
    placeholder="Enter Your Name"
>

<button onclick="saveName()">
    Start Journey
</button>


</section>

<section class="stats">


<div class="card">
    <h3>XP</h3>
    <h1 id="xp">0</h1>
</div>

<div class="card">
    <h3>Level</h3>
    <h1 id="levelDisplay">1</h1>
</div>

<div class="card">
    <h3>Badges</h3>
    <h1 id="badges">0</h1>
</div>


</section>

<section class="languages">


<h2>Select Language</h2>

<div class="lang-grid">

    <button class="lang-btn" onclick="startQuiz('python')">🐍 Python</button>

    <button class="lang-btn" onclick="startQuiz('java')">☕ Java</button>

    <button class="lang-btn" onclick="startQuiz('cpp')">⚡ C++</button>

    <button class="lang-btn" onclick="startQuiz('c')">🔷 C</button>

    <button class="lang-btn" onclick="startQuiz('php')">🌐 PHP</button>

</div>


</section>

<section class="chart-section">
<h2>Your Progress</h2>

<div id="chart"></div>

</section>

<script src="./data/questions.js"></script>
<script src="./data/app.js"></script>
<script src="./data/quiz.js"></script>

</body>
</html>
